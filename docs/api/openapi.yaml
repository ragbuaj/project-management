openapi: 3.1.0

# Sumber kebenaran kontrak API. Tipe TypeScript DIGENERATE dari berkas ini —
# dilarang menulis ulang tipe response secara manual (rules/30-api-contract.md).
#
# Cakupan berkas ini: Fase 0 dan Fase 1. Endpoint fase berikutnya ditambahkan
# di PR yang sama dengan implementasinya, bukan lebih dulu — menulis kontrak
# untuk fitur yang bentuknya belum pasti hanya menghasilkan kontrak yang bohong.

info:
  title: Project Management API
  version: 1.0.0
  description: |
    ## Konvensi

    - Nama field JSON `snake_case`. Konversi ke `camelCase` dilakukan di satu
      lapisan klien.
    - Semua ID berupa `string`, walau di database bertipe `uuid`.
    - Waktu selalu RFC3339 UTC dengan zona eksplisit: `2026-08-06T09:15:00Z`.
      Tanggal murni (`due_date`, `start_date`) berformat `YYYY-MM-DD`.
    - `null` dan "field tidak ada" **tidak** dibedakan artinya. Field yang
      kosong dikirim sebagai `null`, bukan dihilangkan.
    - Setiap response, sukses maupun gagal, membawa header `X-Request-Id`.
    - Paginasi berbasis cursor. `limit` dibatasi server, maksimum 100.

    ## Autentikasi

    - **Browser**: cookie sesi `__Host-session` (`HttpOnly`, `Secure`,
      `SameSite=Lax`). Permintaan yang mengubah data wajib membawa header
      `X-CSRF-Token` yang cocok dengan cookie `__Host-csrf`.
    - **Program** (Fase 9): `Authorization: Bearer pmt_...`. Dikecualikan dari
      pemeriksaan CSRF. Token tidak pernah diterima dari query string.

    Cookie `__Host-csrf` (**tanpa** `HttpOnly` — klien memang harus
    membacanya) diterbitkan server pada permintaan aman mana pun yang datang
    tanpa membawanya. Jadi klien memuat halaman atau memanggil satu `GET` lebih
    dulu, lalu menyalin nilainya ke header pada setiap `POST`, `PATCH`, `PUT`,
    dan `DELETE`. Pasangan yang tidak cocok dijawab `403`, termasuk pada
    `/auth/login` dan `/auth/logout`.

    Rincian di `docs/adr/0005-autentikasi-sesi-cookie.md`.

    ## Otorisasi

    Sumber daya yang bukan hak pemanggil dikembalikan sebagai `404`, bukan
    `403`, supaya keberadaannya tidak bocor. Matriks lengkap ada di
    `docs/authorization.md`.

servers:
  - url: /api/v1

security:
  - cookieAuth: []

tags:
  - name: auth
  - name: invitations
  - name: projects
  - name: boards
  - name: cards

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Masuk dan membuat sesi
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                # Aturan panjangnya ditegakkan saat password dibuat, bukan saat
                # dipakai — lihat ADR-0009. Di sini ia hanya menolak yang tidak
                # mungkin pernah terdaftar, tanpa memberi tahu aturannya.
                password: { type: string, minLength: 1, maxLength: 1024 }
      responses:
        '200':
          description: |
            Sesi dibuat. Cookie `__Host-session` di-set: `HttpOnly`, `Secure`,
            `SameSite=Lax`, `Path=/`.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: |
            Kredensial salah. Respons **identik** untuk email yang tidak
            terdaftar dan password yang salah — termasuk pesannya dan waktu
            jawabnya (ADR-0010), supaya tidak terjadi enumerasi akun.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/logout:
    post:
      tags: [auth]
      summary: Keluar dan mematikan sesi di sisi server
      security: []
      responses:
        '204':
          description: |
            Sesi dihapus dan cookie dikosongkan. Dijawab sama untuk permintaan
            yang tidak membawa sesi sama sekali: pemanggilnya sama-sama berakhir
            dalam keadaan keluar, dan membedakannya hanya memberi tahu apakah
            cookie yang dipegangnya nyata.
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/password/reset:
    post:
      tags: [auth]
      summary: Minta tautan untuk mengatur ulang sandi yang terlupa
      description: |
        **Tanpa sesi.** Yang tidak bisa masuk justru orang yang endpoint ini
        dibuat untuknya.

        **Dijawab `202` apa pun hasilnya** — alamat punya akun, tidak punya
        akun, atau surelnya gagal terkirim. Ini bentuk endpointnya, bukan
        detailnya: `docs/threat-model.md` menutup enumerasi akun di jalur ini,
        dan endpoint yang menjawab "alamat tidak terdaftar" adalah pemeriksa
        alamat yang bisa dipanggil siapa pun tanpa masuk.

        Karena itu **tidak ada `500` untuk kegagalan pengiriman**, berbeda dari
        `POST /invitations` yang justru mewajibkannya. Di sana hanya `owner`
        yang melihat jawabannya; di sini `500` hanya akan muncul kalau alamatnya
        punya akun, yang mengembalikan enumerasi yang baru saja ditutup.

        Sisa risiko yang diterima: **waktu jawab**. Alamat yang punya akun
        menjalankan satu perjalanan SMTP, yang tidak punya langsung menjawab.
        Menutupnya menunggu pengiriman keluar dari jalur permintaan
        ([ADR-0002](../adr/0002-event-transport-outbox.md), Langkah 24).

        Meminta lagi **menutup tautan sebelumnya**. Satu akun tidak pernah punya
        dua tautan reset hidup.

        Berbatas dua lapis ([ADR-0010](../adr/0010-ip-klien-dan-rate-limit.md)):
        3 per jam per akun dan 10 per jam per alamat IP. Keduanya **gagal
        tertutup**.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '202':
          description: |
            Permintaan diterima. Bodinya kosong, dan yang diterima memang
            permintaannya — apakah ada pesan yang dikirim sengaja tidak
            diberitahukan ke pemanggil.
        '400':
          description: |
            `email` kosong atau bukan alamat. Ini satu-satunya penolakan yang
            menyebutkan sesuatu, dan ia tidak menyatakan apa pun tentang
            keberadaan akun.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password/reset/confirm:
    post:
      tags: [auth]
      summary: Tukarkan tautan reset jadi sandi baru
      description: |
        **Tanpa sesi**, dan **tidak menerbitkan sesi**.

        Berhasil berarti seluruh sesi akun itu berakhir — termasuk milik
        perangkat yang sedang dipakai untuk melakukannya. Itu justru gunanya:
        orang yang mereset sandi setelah curiga sedang berusaha melepaskan
        akunnya dari tangan lain, dan reset yang menyisakan sesi lama
        meninggalkannya persis di tempat semula.

        Berbeda dari `POST /invitations/accept`, yang langsung memasukkan
        orangnya. Di sana akunnya baru lahir dan tidak ada yang lain yang bisa
        ia lakukan; di sini pemanggilnya masuk sendiri sesudahnya, lewat
        endpoint yang menghitung percobaan gagal (keputusan pemilik,
        2026-08-08).

        Cookie `__Host-session` ikut **dikosongkan**. Setiap sesi akun ini baru
        saja dihapus di server, jadi peramban yang masih memegangnya memegang
        kredensial mati.

        Kebijakan sandi ada di
        [ADR-0009](../adr/0009-kebijakan-password.md): minimal 12 karakter,
        tanpa aturan komposisi, dinormalisasi NFKC sebelum di-hash.

        Berbatas per alamat: 10 per 10 menit dan 50 per jam, **gagal
        tertutup** — bentuk yang sama dengan `/invitations/accept`, karena ini
        situasi yang sama: endpoint tanpa autentikasi yang membaca kredensial
        dari sebuah URL.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                  description: Bagian terakhir dari tautan di email reset.
                password: { type: string, minLength: 12, maxLength: 1024 }
      responses:
        '204':
          description: |
            Sandi diganti dan seluruh sesi akun itu diakhiri. Tidak ada sesi
            baru; pemanggil masuk lewat `POST /auth/login`.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404':
          description: |
            Tautan tidak pernah diterbitkan, **atau** sudah kedaluwarsa,
            **atau** sudah dipakai, **atau** akunnya sudah dihapus sejak
            tautannya dikirim. Semuanya dijawab sama — membedakannya akan
            memberi tahu pemegang tautan apakah tebakannya salah atau sekadar
            terlambat. Bedanya ada di log server.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /me:
    get:
      tags: [auth]
      summary: Identitas pemanggil saat ini
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
          description: OK
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [auth]
      summary: Ubah profil sendiri
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                timezone: { type: string, description: 'Nama zona IANA, contoh Asia/Jakarta' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationFailed' }

  /me/sessions:
    get:
      tags: [auth]
      summary: Sesi milik pemanggil yang masih hidup
      description: |
        Hanya sesi pemanggil sendiri, **termasuk untuk `owner`** — ini
        satu-satunya baris di `docs/authorization.md` yang tidak punya
        pengecualian owner. Tidak ada cara menanyakan sesi orang lain.

        Sesi yang sudah kedaluwarsa tidak ikut: pertanyaan yang dijawab layar
        ini adalah "apakah ada yang masuk padahal tidak seharusnya", dan baris
        yang sudah tidak bisa mengautentikasi bukan jawabannya.

        Diurutkan dari yang terakhir dipakai. Tidak ada paginasi: jumlah sesi
        satu orang dibatasi jumlah perangkatnya, bukan jumlah datanya.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [auth]
      summary: Akhiri semua sesi **kecuali** yang sedang dipakai
      description: |
        Sesi yang mengirim permintaan ini sengaja dibiarkan hidup.
        `POST /auth/logout` sudah mengakhiri sesi yang sedang dipakai, jadi
        pemanggil yang ingin keluar dari mana-mana termasuk dari sini memanggil
        keduanya. Satu endpoint yang mengeluarkan pemanggilnya sambil masih
        berutang jawaban adalah setengah yang lebih buruk dari pasangan itu.

        `revoked` dikembalikan karena itu satu-satunya cara pemanggil tahu ada
        yang terjadi — "3 perangkat lain dikeluarkan" adalah konfirmasi yang
        dicari orang yang baru saja kehilangan laptop.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: integer
                    description: Jumlah sesi yang diakhiri, tidak termasuk yang sedang dipakai.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [auth]
      summary: Akhiri satu sesi milik sendiri
      description: |
        Mengakhiri sesi yang sedang dipakai **diizinkan**: itu sesi pemanggil,
        ia yang meminta, dan menolak berarti satu-satunya perangkat yang ada di
        tangannya justru yang tidak bisa ia keluarkan. Kalau `id` adalah sesi
        yang sedang dipakai, cookie sesinya ikut dikosongkan.
      responses:
        '204':
          description: Sesi diakhiri.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: |
            Sesi tidak ada, **atau** sesi itu milik orang lain. Keduanya dijawab
            sama supaya tidak ada cara memastikan sebuah id sesi benar-benar ada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /invitations:
    post:
      tags: [invitations]
      summary: Undang pegawai yang belum punya akun
      description: |
        **Hanya `owner`.** Pendaftaran mandiri adalah non-goal, jadi ini
        satu-satunya cara sebuah akun pernah lahir, dan `docs/authorization.md`
        menaruhnya di daftar tertutup hak yang dipegang di luar keanggotaan
        ([ADR-0012](../adr/0012-peran-akun-dan-akses-owner.md)).

        `role` di sini adalah peran **akun** yang akan dipakai saat akunnya
        dibuat, bukan peran di dalam sebuah project. `owner` ditolak dengan
        menyebut namanya: owner hanya ada satu, dan akun itu yang pertama, bukan
        yang diundang.

        Orang yang **sudah** punya akun tidak diundang — ia ditambahkan langsung
        ke folder atau project, tanpa persetujuan. Alamat yang sudah terpakai
        karena itu dijawab `409`.

        Mengundang ulang alamat yang sama **menutup tautan sebelumnya**. Satu
        alamat tidak pernah punya dua tautan hidup.

        Tautannya ada di email dan tidak di mana pun lagi. Response ini tidak
        memuat token, dan tidak akan pernah — mengirimnya ulang berarti membuat
        tautan baru.

        Berbatas: 20 undangan per jam dan 100 per hari, per akun pengundang
        ([ADR-0005](../adr/0005-autentikasi-sesi-cookie.md), ADR-0010).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                role:
                  type: string
                  enum: [maintainer, contributor, viewer]
                  description: Peran akun. `owner` sengaja tidak ada di daftar ini.
      responses:
        '201':
          description: Undangan tercatat dan tautannya terkirim.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            Alamat itu sudah punya akun. Bukan risiko enumerasi seperti di
            `/auth/login`: yang melihat jawaban ini hanya `owner`, dan ia yang
            membuat setiap akun yang ada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500':
          description: |
            Termasuk kasus **undangan tercatat tapi emailnya gagal terkirim**.
            Pesannya menyebutkan keduanya dan apa yang harus dilakukan: undang
            ulang, yang menutup baris sebelumnya dan mengirim tautan baru.

            Bukan `201`, karena `docs/nfr.md` menolak kegagalan pengiriman
            ditelan — undangan yang tidak diterima siapa pun bukan undangan, dan
            `201` akan membuat owner menunggu pegawai yang tidak pernah dikabari.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /invitations/accept:
    post:
      tags: [invitations]
      summary: Tukarkan tautan undangan jadi akun
      description: |
        **Tanpa sesi.** Yang mengikuti tautan undangan belum punya akun — itu
        justru maksud endpoint ini. Yang menggantikan sesi adalah token di
        tautan, dan token itu sekali pakai.

        Alamat dan peran diambil dari undangan, tidak pernah dari permintaan.
        Keduanya adalah keseluruhan dari apa yang disetujui owner, dan
        membiarkan pemegang tautan menyebutkan alamatnya sendiri akan mengubah
        undangan ke satu alamat menjadi cara membuat akun di alamat mana pun.
        Yang datang dari permintaan hanya nama dan sandi.

        Berhasil berarti **langsung masuk**: cookie `__Host-session` ikut
        diterbitkan. Orang yang baru saja membuktikan ia memegang tautannya dan
        memilih sandinya sendiri sudah melakukan semua yang diminta halaman
        login; menyuruhnya mengetik ulang sandi yang ia setel sepuluh detik lalu
        tidak melindungi siapa pun.

        Kebijakan sandi ada di
        [ADR-0009](../adr/0009-kebijakan-password.md): minimal 12 karakter,
        tanpa aturan komposisi, dinormalisasi NFKC sebelum di-hash.

        Berbatas per alamat: 10 per 10 menit dan 50 per jam. **Gagal tertutup** —
        ini endpoint tanpa autentikasi yang membaca kredensial dari sebuah URL.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, name, password]
              properties:
                token:
                  type: string
                  description: Bagian terakhir dari tautan di email undangan.
                name:     { type: string, minLength: 1, maxLength: 200 }
                password: { type: string, minLength: 12, maxLength: 1024 }
      responses:
        '201':
          description: |
            Akun dibuat dan sesinya dimulai. Cookie `__Host-session` disetel.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404':
          description: |
            Tautan tidak pernah diterbitkan, **atau** sudah kedaluwarsa,
            **atau** sudah dipakai. Ketiganya dijawab sama: membedakannya akan
            memastikan kepada pemegang tautan bahwa alamat itu memang pernah
            diundang (`docs/threat-model.md`). Bedanya ada di log server.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            Alamat pada undangan ini sudah punya akun — dibuat lewat jalur lain
            antara tautan dikirim dan tautan diklik. Alamatnya tidak ikut
            disebutkan: yang memegang tautan belum tentu orang yang dituju.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /projects:
    get:
      tags: [projects]
      summary: Daftar project tempat pemanggil menjadi anggota
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: include_archived
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Project' }
                  next_cursor: { type: [string, 'null'] }
    post:
      tags: [projects]
      summary: Buat project baru
      description: |
        Setiap akun aktif boleh. Pembuat otomatis menjadi `admin`. Project baru
        disemai dengan tiga status default — satu per kategori — dan satu
        board.

        Kalau `folder_id` diisi, pemanggil harus `member` atau `admin` folder
        itu, dan seluruh anggota folder ikut mendapat akses sesuai perannya
        di sana (ADR-0011).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, name]
              properties:
                key:
                  type: string
                  pattern: '^[A-Z][A-Z0-9]{1,9}$'
                  description: |
                    Membentuk nomor kartu (`PM-142`). **Tidak bisa diubah
                    setelah project dibuat** — lihat docs/authorization.md.
                name: { type: string, minLength: 1, maxLength: 200 }
                description: { type: string, maxLength: 5000 }
                folder_id:
                  type: [string, 'null']
                  description: Dihilangkan atau `null` berarti project berdiri sendiri.
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`key` sudah dipakai project lain'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /projects/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      summary: Detail project
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [projects]
      summary: Ubah project
      description: '`key` sengaja tidak ada di sini. Lihat docs/authorization.md.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                description: { type: string, maxLength: 5000 }
                archived: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{project_id}/statuses:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      summary: Daftar status milik project
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Status' }
    post:
      tags: [projects]
      summary: Buat status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                category: { $ref: '#/components/schemas/StatusCategory' }
                after_status_id:
                  type: [string, 'null']
                  description: Sisipkan setelah status ini. `null` berarti di awal.
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /projects/{project_id}/boards:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [boards]
      summary: Daftar board milik project
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Board' }

  /boards/{board_id}:
    parameters:
      - name: board_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [boards]
      summary: Board beserta kolom dan kartunya
      description: |
        Satu panggilan untuk seluruh isi board. Kartu dikelompokkan per kolom
        dan sudah terurut menurut `position`.

        Batas: kalau sebuah kolom berisi lebih dari `column_card_limit` kartu,
        hanya sebanyak itu yang dikirim dan `has_more` bernilai `true`. Sisanya
        diambil lewat `/projects/{project_id}/cards`.
      parameters:
        - name: column_card_limit
          in: query
          schema: { type: integer, minimum: 10, maximum: 200, default: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{project_id}/cards:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [cards]
      summary: Daftar kartu dengan penyaringan
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - { name: status_id,   in: query, schema: { type: array, items: { type: string } } }
        - { name: assignee_id, in: query, schema: { type: array, items: { type: string } } }
        - { name: label_id,    in: query, schema: { type: array, items: { type: string } } }
        - { name: priority,    in: query, schema: { type: array, items: { $ref: '#/components/schemas/Priority' } } }
        - { name: due_before,  in: query, schema: { type: string, format: date } }
        - { name: q,           in: query, schema: { type: string, maxLength: 200 }, description: Pencarian teks penuh pada judul dan deskripsi }
        - { name: include_archived, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Card' }
                  next_cursor: { type: [string, 'null'] }
    post:
      tags: [cards]
      summary: Buat kartu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:       { type: string, minLength: 1, maxLength: 500 }
                description: { type: string, maxLength: 100000 }
                status_id:
                  type: [string, 'null']
                  description: Kosong berarti status pertama berkategori `todo`.
                type:        { $ref: '#/components/schemas/CardType' }
                priority:    { $ref: '#/components/schemas/Priority' }
                assignee_id: { type: [string, 'null'] }
                due_date:    { type: [string, 'null'], format: date }
                label_ids:   { type: array, items: { type: string } }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /cards/{card_id}:
    parameters:
      - $ref: '#/components/parameters/CardId'
    get:
      tags: [cards]
      summary: Detail kartu
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [cards]
      summary: Ubah kartu
      description: |
        **Perpindahan status dan posisi tidak dilakukan lewat endpoint ini** —
        gunakan `POST /cards/{card_id}/move`. Memisahkannya membuat pemeriksaan
        transisi workflow (Fase 7) punya satu tempat, bukan tersebar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:       { type: string, minLength: 1, maxLength: 500 }
                description: { type: string, maxLength: 100000 }
                type:        { $ref: '#/components/schemas/CardType' }
                priority:    { $ref: '#/components/schemas/Priority' }
                assignee_id: { type: [string, 'null'], description: Harus anggota project yang sama }
                start_date:  { type: [string, 'null'], format: date }
                due_date:    { type: [string, 'null'], format: date }
                label_ids:   { type: array, items: { type: string }, description: Menggantikan seluruh daftar label }
                archived:    { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [cards]
      summary: Buang kartu ke sampah
      description: |
        Dapat dipulihkan selama 30 hari. Penghapusan permanen adalah endpoint
        terpisah yang hanya boleh dijalankan `admin`.
      responses:
        '204': { description: Dibuang ke sampah }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /cards/{card_id}/move:
    parameters:
      - $ref: '#/components/parameters/CardId'
    post:
      tags: [cards]
      summary: Pindahkan kartu ke status dan posisi lain
      description: |
        Klien mengirim **tetangga**, bukan `position` mentah. Server yang
        menghitung fractional index — lihat
        `docs/adr/0003-urutan-kartu-fractional-index.md`.

        Mengirim tetangga membuat dua permintaan bersamaan menghasilkan dua
        posisi berbeda yang keduanya sah, alih-alih saling menimpa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status_id]
              properties:
                status_id: { type: string }
                after_card_id:
                  type: [string, 'null']
                  description: Kartu yang berada tepat di atas posisi baru. `null` berarti paling atas.
                before_card_id:
                  type: [string, 'null']
                  description: Kartu yang berada tepat di bawah posisi baru. `null` berarti paling bawah.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        '409':
          description: |
            Tetangga yang dikirim sudah tidak berdampingan, atau transisi
            status tidak diizinkan workflow (Fase 7). Klien harus memuat ulang
            kolomnya, bukan mencoba ulang dengan data yang sama.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-session
    bearerAuth:
      type: http
      scheme: bearer
      description: 'API token (Fase 9). Format `pmt_...`.'

  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: { type: string }
    CardId:
      name: card_id
      in: path
      required: true
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Diambil dari `next_cursor` respons sebelumnya. Berbasis keyset, bukan offset.
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }

  responses:
    Unauthorized:
      description: Belum autentikasi
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: |
        Terautentikasi, boleh melihat sumber daya, tapi tidak berhak atas
        aksinya — **atau** pasangan CSRF tidak cocok pada permintaan yang
        mengubah data.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: |
        Tidak ada, **atau** bukan hak pemanggil. Kedua kasus mengembalikan
        respons yang sama supaya keberadaan sumber daya tidak bocor.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: Input tidak lolos validasi
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Kena rate limit
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: |
                Stabil dan boleh dijadikan tumpuan logika klien.
              enum:
                - VALIDATION_FAILED
                - UNAUTHENTICATED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - RATE_LIMITED
                - INTERNAL
            message:
              type: string
              description: |
                Aman ditampilkan di antarmuka. **Bisa berubah** — jangan
                dijadikan tumpuan logika. Tidak pernah memuat stack trace,
                query SQL, versi pustaka, atau jalur berkas.
            details:
              type: array
              items:
                type: object
                required: [field, code]
                properties:
                  field: { type: string }
                  code:  { type: string }
            request_id:
              type: string
              description: Ikut tercatat di log server supaya bisa ditelusuri.

    AccountRole:
      type: string
      description: |
        Peran akun (ADR-0012). Satu-satunya sumber hak seseorang; keanggotaan
        folder dan project hanya menentukan jangkauannya.

        `owner` melihat dan melakukan apa pun di setiap folder dan project
        tanpa perlu jadi anggota, dan aksesnya di luar keanggotaan tercatat.
        `maintainer` dan `owner` boleh membuat folder dan project.
      enum: [owner, maintainer, contributor, viewer]

    User:
      type: object
      required: [id, email, name, timezone, role]
      properties:
        id:       { type: string }
        email:    { type: string, format: email }
        name:     { type: string }
        timezone: { type: string }
        role:     { $ref: '#/components/schemas/AccountRole' }

    Session:
      description: |
        Satu sesi yang masih hidup, seperti yang dilihat pemiliknya sendiri.

        **Tidak memuat token maupun digest-nya, dan tidak akan pernah.** Yang
        dibutuhkan layar ini adalah mengenali sebuah sesi — kapan mulai, dari
        apa, kapan terakhir dipakai — dan tak satu pun dari itu menuntut
        kredensialnya. Endpoint daftar justru tempat satu field nyasar berubah
        jadi token yang duduk di dalam body JSON.
      type: object
      required: [id, user_agent, created_at, last_seen_at, expires_at, current]
      properties:
        id:           { type: string, format: uuid }
        user_agent:
          type: string
          description: |
            Apa adanya dari header, dipotong di 512 karakter. Dikirim klien,
            jadi ia petunjuk untuk mengenali perangkat, bukan fakta.
        created_at:   { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at:   { type: string, format: date-time }
        current:
          type: boolean
          description: |
            Benar untuk sesi yang mengirim permintaan ini, supaya antarmuka bisa
            menandainya "perangkat ini" dan memperingatkan sebelum seseorang
            mengeluarkan dirinya sendiri.

    Invitation:
      description: |
        Undangan yang baru dibuat, seperti yang dilihat pengundangnya.

        **Tidak memuat token maupun digest-nya, dan tidak akan pernah.** Token
        itu ada satu kali, di tautan yang berangkat lewat email, dan tidak
        pernah lagi — bahkan owner yang mengirimnya tidak bisa membacanya
        kembali. Justru itu yang membuat digest yang tersimpan ada gunanya.
      type: object
      required: [id, email, role, expires_at]
      properties:
        id:    { type: string, format: uuid }
        email: { type: string, format: email }
        role:
          type: string
          enum: [maintainer, contributor, viewer]
          description: Peran akun yang akan dipakai saat akunnya dibuat.
        expires_at:
          type: string
          format: date-time
          description: |
            Tujuh hari sejak dibuat. Cukup panjang untuk bertahan melewati
            undangan Jumat sore atau seminggu cuti, cukup pendek supaya tautan
            yang terlanjur diteruskan ke grup obrolan berhenti bekerja.

    UserRef:
      description: Bentuk ringkas untuk disematkan. Tidak memuat email.
      type: object
      required: [id, name]
      properties:
        id:   { type: string }
        name: { type: string }

    Project:
      type: object
      required: [id, key, name, description, folder_id, my_role, created_at, archived_at]
      properties:
        id:          { type: string }
        key:         { type: string, examples: ['PM'] }
        name:        { type: string }
        description: { type: string }
        folder_id:   { type: [string, 'null'], description: '`null` berarti project berdiri sendiri (ADR-0011)' }
        my_role:
          $ref: '#/components/schemas/AccountRole'
          description: |
            Peran akun pemanggil, diulang di sini supaya klien tidak perlu
            mencarinya terpisah. Sejak ADR-0012 ia sama untuk setiap project —
            keanggotaan menentukan jangkauan, bukan peran.
        created_at:  { type: string, format: date-time }
        archived_at: { type: [string, 'null'], format: date-time }

    StatusCategory:
      type: string
      description: |
        Sumber kebenaran untuk "selesai" — **bukan** nama status. Laporan dan
        penanda terlambat membaca field ini.
      enum: [todo, in_progress, done]

    Status:
      type: object
      required: [id, name, category, position]
      properties:
        id:       { type: string }
        name:     { type: string }
        category: { $ref: '#/components/schemas/StatusCategory' }
        position: { type: string, description: 'Fractional index. Opak bagi klien — hanya untuk pengurutan.' }

    Board:
      type: object
      required: [id, project_id, name, position, archived_at]
      properties:
        id:          { type: string }
        project_id:  { type: string }
        name:        { type: string }
        position:    { type: string }
        archived_at: { type: [string, 'null'], format: date-time }

    BoardColumn:
      type: object
      required: [id, status_id, name, position, wip_limit]
      properties:
        id:        { type: string }
        status_id: { type: string }
        name:      { type: string }
        position:  { type: string }
        wip_limit: { type: [integer, 'null'] }

    BoardDetail:
      type: object
      required: [board, columns]
      properties:
        board: { $ref: '#/components/schemas/Board' }
        columns:
          type: array
          items:
            type: object
            required: [column, cards, total_count, has_more]
            properties:
              column: { $ref: '#/components/schemas/BoardColumn' }
              cards:
                type: array
                items: { $ref: '#/components/schemas/Card' }
              total_count: { type: integer }
              has_more:    { type: boolean }

    CardType:
      type: string
      enum: [epic, story, task, bug, subtask]
      default: task

    Priority:
      type: string
      enum: [low, medium, high, urgent]
      default: medium

    Label:
      type: object
      required: [id, name, color]
      properties:
        id:    { type: string }
        name:  { type: string }
        color: { type: string, pattern: '^#[0-9a-f]{6}$' }

    Card:
      type: object
      required:
        - id
        - project_id
        - key
        - number
        - type
        - title
        - description
        - status_id
        - position
        - priority
        - assignee
        - reporter
        - labels
        - due_date
        - created_at
        - updated_at
        - archived_at
      properties:
        id:          { type: string }
        project_id:  { type: string }
        key:         { type: string, examples: ['PM-142'], description: 'Untuk manusia. Jangan dipakai sebagai kunci — gunakan `id`.' }
        number:      { type: integer }
        type:        { $ref: '#/components/schemas/CardType' }
        title:       { type: string }
        description: { type: string, description: Markdown mentah. Render dilakukan klien, tanpa `dangerouslySetInnerHTML` pada HTML dari pengguna. }
        status_id:   { type: string }
        position:    { type: string, description: Opak. Klien hanya mengurutkan dengannya, tidak pernah menghitungnya. }
        priority:    { $ref: '#/components/schemas/Priority' }
        assignee:    { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
        reporter:    { $ref: '#/components/schemas/UserRef' }
        labels:
          type: array
          items: { $ref: '#/components/schemas/Label' }
        start_date:   { type: [string, 'null'], format: date }
        due_date:     { type: [string, 'null'], format: date }
        completed_at: { type: [string, 'null'], format: date-time }
        created_at:   { type: string, format: date-time }
        updated_at:   { type: string, format: date-time }
        archived_at:  { type: [string, 'null'], format: date-time }
