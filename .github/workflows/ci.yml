name: CI

# Hanya job yang relevan untuk setiap PR. Yang disaring per-path punya berkas
# workflow sendiri — api-contract.yml dan migrations.yml — supaya runner-nya
# tidak dinyalakan sama sekali saat berkasnya tidak tersentuh.
on:
  push:
    branches: [main]
  pull_request:

# Hook lokal bisa dilewati dengan --no-verify; job di sini tidak.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go — vet, lint, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Test integrasi butuh PostgreSQL sungguhan. Mem-mock driver SQL hanya
    # menguji mock-nya sendiri (rules/20-go.md), dan yang diperiksa di sini
    # justru apakah PostgreSQL benar-benar menerima setelan yang dikirim.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pm
          POSTGRES_PASSWORD: pm
          POSTGRES_DB: pm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pm -d pm_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Same reasoning as PostgreSQL above: the tests check what Redis really
      # does with a key, a TTL, and a script. A fake would only prove the fake
      # behaves as written.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pm:pm@localhost:5432/pm_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          # go.mod sebagai satu-satunya sumber versi Go. Menuliskan angkanya
          # lagi di sini hanya melahirkan dua nilai yang harus naik bersamaan,
          # dan suatu hari salah satunya tidak ikut.
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: backend

      # -race di sini, bukan di hook lokal: detektor balapan menuntut cgo, yang
      # tidak selalu ada di mesin pengembangan.
      - name: go test -race
        run: go test -race ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  secret:
    name: Pemindai secret
    runs-on: ubuntu-latest
    steps:
      # Riwayat penuh: gitleaks memindai commit, bukan hanya working tree.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod

      - name: Pasang gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@latest

      - name: Pindai
        run: gitleaks git --no-banner
