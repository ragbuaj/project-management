name: CI

on:
  push:
    branches: [main]
  pull_request:

# Hook lokal bisa dilewati dengan --no-verify; job di sini tidak.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Menutup GO-2026-4971 dkk. Naikkan bersama go.mod, jangan salah satu saja —
  # govulncheck di pre-push akan menolak push kalau keduanya berbeda.
  GO_VERSION: "1.25.12"

jobs:
  go:
    name: Go — vet, lint, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Test integrasi butuh PostgreSQL sungguhan. Mem-mock driver SQL hanya
    # menguji mock-nya sendiri (rules/20-go.md), dan yang diperiksa di sini
    # justru apakah PostgreSQL benar-benar menerima setelan yang dikirim.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pm
          POSTGRES_PASSWORD: pm
          POSTGRES_DB: pm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pm -d pm_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pm:pm@localhost:5432/pm_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: go vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: backend

      # -race di sini, bukan di hook lokal: detektor balapan menuntut cgo, yang
      # tidak selalu ada di mesin pengembangan.
      - name: go test -race
        run: go test -race ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  secret:
    name: Pemindai secret
    runs-on: ubuntu-latest
    steps:
      # Riwayat penuh: gitleaks memindai commit, bukan hanya working tree.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Pasang gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@latest

      - name: Pindai
        run: gitleaks git --no-banner

  migration-lint:
    name: Migration — squawk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cari migration yang ada
        id: cari
        run: |
          if compgen -G "backend/db/migrations/*.sql" > /dev/null; then
            echo "ada=true" >> "$GITHUB_OUTPUT"
          else
            echo "ada=false" >> "$GITHUB_OUTPUT"
            echo "Belum ada migration — dilewati."
          fi
        shell: bash

      - uses: pnpm/action-setup@v4
        if: steps.cari.outputs.ada == 'true'
        with:
          version: 10.30.3

      - name: squawk
        if: steps.cari.outputs.ada == 'true'
        run: pnpm dlx squawk-cli --pg-version=18.0 backend/db/migrations/*.sql

  api-contract:
    name: Kontrak API — oasdiff
    runs-on: ubuntu-latest
    # Hanya berjalan saat spec tersentuh. Tanpa ini, job berjalan di setiap PR
    # dan orang berhenti membaca hasilnya.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apakah spec berubah?
        id: ubah
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --quiet "origin/${{ github.base_ref }}" -- docs/api/openapi.yaml; then
            echo "ada=false" >> "$GITHUB_OUTPUT"
            echo "Spec tidak berubah — dilewati."
          else
            echo "ada=true" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - uses: actions/setup-go@v6
        if: steps.ubah.outputs.ada == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Pasang oasdiff
        if: steps.ubah.outputs.ada == 'true'
        run: go install github.com/oasdiff/oasdiff@latest

      # Spec pembanding diambil dari branch tujuan, bukan berkas lokal.
      # Exit code 1 kalau ada perubahan yang merusak klien lama.
      - name: Periksa perubahan yang merusak
        if: steps.ubah.outputs.ada == 'true'
        run: |
          git show "origin/${{ github.base_ref }}:docs/api/openapi.yaml" > /tmp/openapi-base.yaml
          oasdiff breaking /tmp/openapi-base.yaml docs/api/openapi.yaml
        shell: bash
